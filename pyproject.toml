[project]
name = "notes-to-linear"
version = "0.1.0"
description = "Drop a markdown note in a folder, get clean Linear issues out."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
notes-to-linear = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
markers = [
    "eval: live LLM eval (requires ANTHROPIC_API_KEY, costs money, opt-in via --run-evals)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "schemas*"]
